name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    name: Script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py
